<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>HYPERVISOR</title>
  <style>
    @font-face {
      font-family: "Xer0";
      src: url("fonts/Xer0-Regular.otf") format("opentype");
      font-weight: normal;
      font-style: normal;
    }

    :root {
      --bg: #0a0b0d;
      --line: rgba(255, 255, 255, 0.08);
      --line-soft: rgba(255, 255, 255, 0.05);
      --text: #e8eaed;
      --muted: #7d838d;
      --accent: #4ade80;
      --dead: #565b64;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      background: transparent;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      cursor: default;
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      color: var(--text);
    }

    #stage {
      position: fixed;
      inset: 0;
      clip-path: inset(0 0 0 0);
      transition: clip-path 300ms cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    /* Fully clipped = invisible. Masking is instant (no transition), only
       the reveal animates; the window only becomes visible after the masked
       state has painted, so there is never a flash of unclipped content. */
    #stage.masked { clip-path: inset(0 0 100% 0); transition: none; }

    #shell {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    #logo {
      position: absolute;
      top: 16px;
      left: 24px;
      display: flex;
      align-items: center;
      font-family: "Xer0", monospace;
      font-size: 14px;
      letter-spacing: 0.14em;
      color: var(--text);
    }

    #content {
      position: absolute;
      left: 16px;
      right: 16px;
      bottom: 14px;
      display: flex;
      gap: 12px;
      font-size: 11px;
    }

    /* ---- left rail ---- */
    #rail {
      width: 290px;
      flex: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 0;
    }

    #launcher {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: rgba(255, 255, 255, 0.02);
    }

    select, textarea, button {
      font: inherit;
      color: var(--text);
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--line);
      border-radius: 6px;
      outline: none;
    }

    select { padding: 6px 8px; -webkit-appearance: none; }

    textarea {
      padding: 7px 8px;
      resize: none;
      height: 52px;
      cursor: text;
      user-select: text;
      -webkit-user-select: text;
    }
    textarea::placeholder { color: var(--muted); }

    button {
      padding: 7px 10px;
      letter-spacing: 0.08em;
      cursor: pointer;
    }
    button:hover { background: rgba(255, 255, 255, 0.09); }
    button:disabled { opacity: 0.4; cursor: default; }

    #sessions {
      list-style: none;
      overflow-y: auto;
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .session {
      border: 1px solid var(--line-soft);
      border-radius: 8px;
      padding: 8px 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .session:hover { border-color: var(--line); background: rgba(255, 255, 255, 0.03); }
    .session.selected { border-color: rgba(74, 222, 128, 0.35); background: rgba(74, 222, 128, 0.05); }

    .dot { width: 6px; height: 6px; border-radius: 50%; flex: none; background: var(--dead); }
    .dot.alive { background: var(--accent); box-shadow: 0 0 6px rgba(74, 222, 128, 0.7); }

    .session .meta { min-width: 0; }
    .session .who { color: var(--muted); font-size: 10px; letter-spacing: 0.06em; }
    .session .snippet {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }

    /* ---- detail pane ---- */
    #detail {
      flex: 1;
      min-width: 0;
      border: 1px solid var(--line-soft);
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.015);
    }

    #pinned {
      padding: 10px 14px;
      border-bottom: 1px solid var(--line-soft);
      background: rgba(255, 255, 255, 0.03);
      flex: none;
    }
    #pinned .tag {
      color: var(--muted);
      font-size: 9px;
      letter-spacing: 0.18em;
      margin-bottom: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    #pinned .prompt-text {
      user-select: text;
      -webkit-user-select: text;
      line-height: 1.5;
    }
    #kill {
      font-size: 9px;
      padding: 3px 8px;
      border-radius: 5px;
    }

    #blocks {
      flex: 1;
      overflow-y: auto;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .block {
      border-left: 2px solid var(--line);
      padding-left: 10px;
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.45;
      color: #c6cad1;
      user-select: text;
      -webkit-user-select: text;
    }

    #composer {
      display: flex;
      gap: 8px;
      padding: 10px;
      border-top: 1px solid var(--line-soft);
      flex: none;
    }
    #composer input {
      flex: 1;
      padding: 7px 8px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--text);
      font: inherit;
      outline: none;
      cursor: text;
      user-select: text;
      -webkit-user-select: text;
    }
    #composer input::placeholder { color: var(--muted); }

    .empty {
      color: var(--muted);
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 1;
      letter-spacing: 0.08em;
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.12); border-radius: 3px; }
    ::-webkit-scrollbar-track { background: transparent; }
  </style>
</head>
<body>
  <div id="stage" class="masked" data-tauri-drag-region>
    <svg id="shell" xmlns="http://www.w3.org/2000/svg">
      <path id="hull" fill="#0a0b0d" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
    </svg>
    <div id="logo" data-tauri-drag-region>HYPERVISOR</div>

    <div id="content">
      <aside id="rail">
        <div id="launcher">
          <select id="model"></select>
          <textarea id="prompt" placeholder="prompt…" spellcheck="false"></textarea>
          <button id="start">START SESSION</button>
        </div>
        <ul id="sessions"></ul>
      </aside>
      <main id="detail">
        <div class="empty">no session selected</div>
      </main>
    </div>
  </div>

  <script>
    const invoke = (cmd, args) => window.__TAURI__.core.invoke(cmd, args);

    const MODELS = [
      { provider: "anthropic", model: "sonnet",                label: "CLAUDE SONNET" },
      { provider: "anthropic", model: "opus",                  label: "CLAUDE OPUS" },
      { provider: "openai",    model: "gpt-5-codex",           label: "GPT-5 CODEX" },
      { provider: "opencode",  model: "google/gemini-2.5-pro", label: "GEMINI 2.5 PRO" },
    ];

    let cutout = null;
    let selected = null;

    // ---- hull ----
    function draw() {
      const W = window.innerWidth, H = window.innerHeight;
      const R = 12, rc = 10;
      const svg = document.getElementById("shell");
      svg.setAttribute("viewBox", `0 0 ${W} ${H}`);

      let d;
      if (cutout && cutout.left > R + rc && cutout.right < W - R - rc) {
        const cl = cutout.left, cr = cutout.right, cd = cutout.depth;
        d = [
          `M ${R} 0`,
          `H ${cl - rc}`, `Q ${cl} 0 ${cl} ${rc}`,
          `V ${cd - rc}`, `Q ${cl} ${cd} ${cl + rc} ${cd}`,
          `H ${cr - rc}`, `Q ${cr} ${cd} ${cr} ${cd - rc}`,
          `V ${rc}`, `Q ${cr} 0 ${cr + rc} 0`,
          `H ${W - R}`, `Q ${W} 0 ${W} ${R}`,
          `V ${H - R}`, `Q ${W} ${H} ${W - R} ${H}`,
          `H ${R}`, `Q 0 ${H} 0 ${H - R}`,
          `V ${R}`, `Q 0 0 ${R} 0`, "Z",
        ].join(" ");
      } else {
        d = [
          `M ${R} 0`,
          `H ${W - R}`, `Q ${W} 0 ${W} ${R}`,
          `V ${H - R}`, `Q ${W} ${H} ${W - R} ${H}`,
          `H ${R}`, `Q 0 ${H} 0 ${H - R}`,
          `V ${R}`, `Q 0 0 ${R} 0`, "Z",
        ].join(" ");
      }
      document.getElementById("hull").setAttribute("d", d);
      document.getElementById("content").style.top =
        ((cutout ? cutout.depth : 40) + 12) + "px";
    }

    // ---- sessions ----
    function esc(s) {
      return s.replace(/[&<>"]/g, (c) =>
        ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    }

    async function refreshList() {
      let sessions;
      try { sessions = await invoke("list_sessions"); } catch (e) { return; }
      const ul = document.getElementById("sessions");
      ul.innerHTML = sessions.map((s) => `
        <li class="session ${s.name === selected ? "selected" : ""}" data-name="${s.name}">
          <span class="dot ${s.alive ? "alive" : ""}"></span>
          <span class="meta">
            <div class="who">${esc(s.label)} · ${s.alive ? "RUNNING" : "ENDED"}</div>
            <div class="snippet">${esc(s.prompt)}</div>
          </span>
        </li>`).join("");
      ul.querySelectorAll(".session").forEach((li) => {
        li.addEventListener("click", () => select(li.dataset.name));
      });
    }

    function renderDetailSkeleton() {
      document.getElementById("detail").innerHTML = `
        <div id="pinned">
          <div class="tag">
            <span id="pinned-status"></span>
            <button id="kill" style="display: none">END</button>
          </div>
          <div class="prompt-text" id="pinned-prompt"></div>
        </div>
        <div id="blocks"><div class="empty">loading…</div></div>
        <div id="composer">
          <input id="followup" placeholder="send a follow-up prompt…" spellcheck="false" />
          <button id="send">SEND</button>
        </div>`;
      document.getElementById("kill").addEventListener("click", async () => {
        await invoke("kill_session", { name: selected }).catch(() => {});
        refreshList();
        refreshDetail();
      });
      document.getElementById("send").addEventListener("click", sendFollowup);
      document.getElementById("followup").addEventListener("keydown", (e) => {
        if (e.key === "Enter") sendFollowup();
      });
    }

    async function sendFollowup() {
      const input = document.getElementById("followup");
      const btn = document.getElementById("send");
      const text = input.value.trim();
      if (!text || !selected) return;
      btn.disabled = true;
      try {
        await invoke("send_prompt", { name: selected, text });
        input.value = "";
        setTimeout(refreshDetail, 600);
      } catch (e) {
        btn.textContent = "ERR";
        setTimeout(() => (btn.textContent = "SEND"), 2500);
      } finally {
        btn.disabled = false;
      }
    }

    async function refreshDetail() {
      if (!selected || !document.getElementById("pinned-status")) return;
      let peek;
      try { peek = await invoke("peek_session", { name: selected }); } catch (e) { return; }
      const s = peek.session;
      document.getElementById("pinned-status").textContent =
        `PROMPT · ${s.label} · ${s.alive ? "RUNNING" : "ENDED"}`;
      document.getElementById("pinned-prompt").textContent = s.prompt;
      document.getElementById("kill").style.display = s.alive ? "" : "none";
      document.getElementById("followup").disabled = !s.alive;
      const el = document.getElementById("blocks");
      const atBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 30;
      el.innerHTML = peek.blocks.length
        ? peek.blocks.map((b) => `<div class="block">${esc(b)}</div>`).join("")
        : `<div class="empty">${s.alive ? "waiting for output…" : "session ended — transcript gone with its tmux pane"}</div>`;
      if (atBottom) el.scrollTop = el.scrollHeight;
    }

    function select(name) {
      selected = name;
      renderDetailSkeleton();
      refreshList();
      refreshDetail();
    }

    async function start() {
      const btn = document.getElementById("start");
      const promptEl = document.getElementById("prompt");
      const m = MODELS[document.getElementById("model").selectedIndex];
      const prompt = promptEl.value.trim();
      if (!prompt) return;
      btn.disabled = true;
      try {
        const s = await invoke("start_session", {
          provider: m.provider, model: m.model, label: m.label, prompt,
        });
        promptEl.value = "";
        select(s.name);
      } catch (e) {
        btn.textContent = "FAILED — " + e;
        setTimeout(() => (btn.textContent = "START SESSION"), 4000);
      } finally {
        btn.disabled = false;
      }
    }

    // ---- boot ----
    async function boot() {
      document.getElementById("model").innerHTML =
        MODELS.map((m) => `<option>${m.label}</option>`).join("");
      document.getElementById("start").addEventListener("click", start);
      try { cutout = await invoke("geometry"); } catch (e) { cutout = null; }
      draw();
      try {
        const listen = window.__TAURI__.event.listen;
        listen("overlay-show", showFlow);
        listen("overlay-hide", maskStage);
        listen("overlay-expand", beginExpand);
      } catch (e) {}
      showFlow();
      refreshList();
      setInterval(refreshList, 5000);
      setInterval(refreshDetail, 3000);
    }

    const stage = () => document.getElementById("stage");

    function maskStage() {
      stage().classList.add("masked");
    }

    // Show handshake: mask to zero height, force it to paint, tell Rust to
    // order the window front, then slide open.
    async function showFlow() {
      const s = stage();
      s.classList.add("masked");
      void s.offsetWidth;
      try { await invoke("reveal_ready"); } catch (e) { return; }
      requestAnimationFrame(() =>
        requestAnimationFrame(() => s.classList.remove("masked")));
    }

    // Fullscreen expand: pin the clip at the current bottom edge (a no-op at
    // the current size), so when the window grows the new area starts hidden,
    // then transition it open on the resize that follows.
    let pendingExpand = false;
    function beginExpand() {
      const s = stage();
      s.style.transition = "none";
      s.style.clipPath = `inset(0 0 calc(100% - ${window.innerHeight}px) 0)`;
      pendingExpand = true;
    }

    window.addEventListener("resize", () => {
      draw();
      if (pendingExpand) {
        pendingExpand = false;
        const s = stage();
        void s.offsetWidth;
        s.style.transition = "";
        s.style.clipPath = "";
      }
    });
    window.addEventListener("keydown", (e) => {
      if (e.key !== "Escape") return;
      const a = document.activeElement;
      if (a && ["INPUT", "TEXTAREA", "SELECT"].includes(a.tagName)) a.blur();
      else window.__TAURI__?.core.invoke("hide_overlay");
    });
    boot();
  </script>
</body>
</html>
